server {
    listen 80;
    server_name _;

    # Resolver embebido de Docker: fuerza a nginx a re-resolver los nombres
    # de los upstreams en cada request en lugar de cachear la IP al arrancar.
    # Evita el 502 permanente si un contenedor arranca despues que nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Imagen procesada por imagor (URLs firmadas por Flask)
    location /img/ {
        set $imagor_upstream imagor;
        rewrite ^/img/(.*)$ /$1 break;
        proxy_pass http://$imagor_upstream:8000;
        proxy_set_header Host $host;
    }

    location / {
        set $web_upstream web;
        proxy_pass http://$web_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
